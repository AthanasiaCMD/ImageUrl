<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload & Share Foto</title>
    <!-- Google Fonts: Space Grotesk biar nuansa brutalism makin keluar -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background: #ffde59; /* Kuning cerah Khas Neo-Brutalism */
            background-image: radial-gradient(#000 8%, transparent 8%);
            background-size: 24px 24px;
        }

        .container { 
            background: #ffffff; 
            padding: 2rem; 
            border: 4px solid #000000; 
            box-shadow: 8px 8px 0px #000000; 
            width: 380px; 
            text-align: center; 
            transition: transform 0.1s ease;
        }

        .container:hover {
            transform: translate(-2px, -2px);
            box-shadow: 10px 10px 0px #000000;
        }

        h2 {
            margin-top: 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -1px;
            font-size: 28px;
        }

        /* Styling Input File ala Kotak Neo-Brutalism */
        input[type="file"] { 
            margin: 20px 0; 
            width: 100%;
            border: 3px dashed #000;
            padding: 15px 10px;
            background: #f4f4f4;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            box-sizing: border-box;
        }

        input[type="file"]::file-selector-button {
            background: #ff5757;
            color: black;
            border: 2px solid #000;
            padding: 8px 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            transition: all 0.1s ease;
        }

        input[type="file"]::file-selector-button:hover {
            background: #ff3333;
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px #000;
        }

        /* Tombol Utama */
        button { 
            background: #00f0ff; /* Cyan kontras */
            color: #000000; 
            border: 3px solid #000000; 
            padding: 12px 20px; 
            font-weight: 700;
            font-size: 16px;
            cursor: pointer; 
            width: 100%; 
            box-shadow: 4px 4px 0px #000000;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            transition: all 0.1s ease;
        }

        button:hover:not(:disabled) {
            background: #00d2df;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }

        button:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        #result { 
            margin-top: 25px; 
            display: none; 
            border-top: 3px solid #000;
            padding-top: 15px;
            text-align: left;
        }

        #result p {
            font-weight: 700;
            margin: 8px 0 4px 0;
            font-size: 14px;
        }

        /* Layout Container Link & Tombol Copy */
        .copy-group {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        /* Input Text Link */
        input[type="text"] { 
            flex: 1;
            padding: 10px; 
            border: 3px solid #000000; 
            background: #fffdf0;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            box-sizing: border-box;
            box-shadow: 3px 3px 0px #000000;
            outline: none;
            font-size: 13px;
        }

        /* Tombol Salin Khusus */
        .copy-btn {
            background: #ff90e8; /* Pink pastel kontras */
            border: 3px solid #000000;
            padding: 0 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000000;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            font-size: 13px;
            width: auto;
            transition: all 0.1s ease;
        }

        .copy-btn:hover {
            background: #ff70e0;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #000000;
        }

        .copy-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000000;
        }

        /* Preview Gambar */
        #preview { 
            width: 100%; 
            margin-top: 10px; 
            border: 3px solid #000000; 
            box-shadow: 4px 4px 0px #000000;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Upload Foto</h2>
    <input type="file" id="fileInput" accept="image/*">
    <button onclick="uploadFoto()" id="uploadBtn">Upload Sekarang</button>

    <div id="result">
        <p style="color: #008000; background: #e6ffed; border: 2px solid #000; padding: 6px; text-align: center; box-shadow: 2px 2px 0px #000;">⚡ Foto Berhasil Diupload!</p>
        <img id="preview" src="" alt="">
        <p>Link Foto:</p>
        <div class="copy-group">
            <input type="text" id="linkFoto" readonly onclick="this.select()">
            <button type="button" class="copy-btn" id="copyBtn" onclick="copyLink()">Copy</button>
        </div>
        <p style="font-size: 11px; color: #555; text-align: center; margin-top: 8px;" id="copyStatus">(Klik tombol / link untuk copy)</p>
    </div>
</div>

<script>
    async function uploadFoto() {
        const fileInput = document.getElementById('fileInput');
        const btn = document.getElementById('uploadBtn');
        const resultDiv = document.getElementById('result');
        
        if (fileInput.files.length === 0) return alert("Pilih foto dulu, Bro!");

        btn.innerText = "Sedang Upload...";
        btn.disabled = true;

        const formData = new FormData();
        formData.append("image", fileInput.files[0]);

        // GANTI API KEY DI BAWAH INI
        const apiKey = "84349c8d3036624de90b5377f539e432"; 

        try {
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
                method: "POST",
                body: formData
            });
            const data = await response.json();

            if (data.success) {
                document.getElementById('linkFoto').value = data.data.url;
                document.getElementById('preview').src = data.data.url;
                resultDiv.style.display = "block";
                btn.innerText = "Upload Lagi";
                btn.disabled = false;
                document.getElementById('copyBtn').innerText = "Copy";
                document.getElementById('copyStatus').innerText = "(Klik tombol / link untuk copy)";
            } else {
                throw new Error("Upload gagal dari server");
            }
        } catch (error) {
            alert("Gagal upload!");
            btn.innerText = "Upload Sekarang";
            btn.disabled = false;
        }
    }

    function copyLink() {
        const linkInput = document.getElementById('linkFoto');
        const copyBtn = document.getElementById('copyBtn');
        const copyStatus = document.getElementById('copyStatus');

        linkInput.select();
        linkInput.setSelectionRange(0, 99999); // Untuk perangkat mobile

        navigator.clipboard.writeText(linkInput.value).then(() => {
            copyBtn.innerText = "Copied!";
            copyStatus.innerText = "✨ Link berhasil disalin ke clipboard!";
            copyStatus.style.color = "#d90000";
            
            setTimeout(() => {
                copyBtn.innerText = "Copy";
            }, 2000);
        }).catch(err => {
            alert("Gagal menyalin link.");
        });
    }
</script>

</body>
</html>
